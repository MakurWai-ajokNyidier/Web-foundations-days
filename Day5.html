<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 5 - Users API</title>

    <link rel="stylesheet" href="Day5.css">
</head>
<body>

    <header>
        <h1>Users Management</h1>
        <p>Load, search, and remove users from the API.</p>
    </header>

    <main>
        <section>
            <h2>Manage Users</h2>

            <div class="button-group">
                <button id="load-users" type="button">Load Users</button>
                <button id="remove-users" type="button">Remove Users</button>
            </div>

            <label for="filter-input">Filter users by name:</label>
            <input
                type="text"
                id="filter-input"
                placeholder="Enter a name to search"
            >

            <p id="status" role="status" aria-live="polite"></p>

            <ul id="users-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Users Management. All rights reserved.</p>
    </footer>
<script src="Day5.js" defer></script>
</body>
</html>
