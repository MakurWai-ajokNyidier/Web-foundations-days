<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="Day4Stlye.css">
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Capture Whatever You Want to Remember.</p>
    </header>

    <main>

        <!-- Add a Note Section -->
        <section class="card">
            <h2>Add a note</h2>

            <form id="note-form">

                <div class="form-group">
                    <label for="note-input">Note</label>
                    <input
                        type="text"
                        id="note-input"
                        placeholder="Write your note..."
                        maxlength="200"
                    >
                </div>

                <div class="form-group">
                    <label for="category-select">Category</label>
                    <select id="category-select">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>

            </form>

            <p id="error-message" class="error-message"></p>
        </section>

        <!-- Your Notes Section -->
        <section class="card">
            <div class="notes-header">
                <h2>Your notes</h2>

                <button type="button" id="clear-all-button" class="clear-button">
                    Clear All
                </button>
            </div>

            <label for="search-input" class="search-label">Search notes</label>

            <input
                type="search"
                id="search-input"
                placeholder="Search your notes..."
            >

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>

    </main>

    <footer>
        <p>&copy; Makuur QuickNotes. All rights reserved.</p>
    </footer>

    <script src="Day4Script.js"></script>
</body>
</html>
