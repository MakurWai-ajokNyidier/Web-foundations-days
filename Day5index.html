<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Users</title>
    <link rel="stylesheet" href="Day5style.css">
</head>
<body>
    <header>
        <h1>Library Users</h1>
        <p>Load, search, & remove users from the API.</p>
    </header>

    <main>
        <button id="load-users">Load Users</button>

        <div>
            <label for="filter-input">Filter users by name:</label>
            <input type="text" id="filter-input" placeholder="Enter a name">
        </div>

        <p id="status" role="status" aria-live="polite"></p>

        <ul id="users-list"></ul>

        <div class="button-group">
            <button id="remove-users">Remove Users</button>
        </div>
    </main>

    <footer>
        <p>&copy; Library Users,2026. All rights reserved.</p>
    </footer>
   <script src="Day5Users.js" defer></script>
</body>
</html>
