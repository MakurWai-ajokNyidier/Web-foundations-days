<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Users</title>

    <script src="Userscript.js" defer></script>
    <link rel="stylesheet" href="Userstyle.css">
</head>
<body>

    <header>
        <h1>Library Users</h1>
    </header>

    <main>
        <button id="load-users">Load Users</button>

        <div>
            <label for="filter-input">Filter users by name:</label>
            <input
                type="text"
                id="filter-input"
                placeholder="Enter a name"
            >
        </div>

        <p id="status"> Click Load Users to load users.</p>

        <ul id="users-list"></ul>
    </main>

    <footer>
        <p>&copy; 2026 Library Users. All rights reserved.</p>
    </footer>

</body>
</html>
